services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dimo_did
      POSTGRES_USER: dimo
      POSTGRES_PASSWORD: dimo
    volumes:
      - ./scripts/init-org-host-db.sql:/docker-entrypoint-initdb.d/org-host.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimo -d dimo_did"]
      interval: 2s
      timeout: 5s
      retries: 5

  directory:
    build:
      context: .
      target: directory
    environment:
      DATABASE_URL: "postgres://dimo:dimo@postgres:5432/dimo_did?sslmode=disable"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-settings", "/dev/null"]


  org-host:
    build:
      context: .
      target: org-host
    environment:
      DATABASE_URL: "postgres://dimo:dimo@postgres:5432/dimo_org_host?sslmode=disable"
      PORT: "8081"
      # Development only: a fixed master key seals org signing keys at rest.
      MASTER_KEY: "${ORG_HOST_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
      # Where the identity token issuer (dauth) publishes its RS256 keys.
      IDENTITY_JWKS_URL: "${IDENTITY_JWKS_URL:-}"
      IDENTITY_JWKS: "${IDENTITY_JWKS:-}"
      DIRECTORY_URL: "http://directory:8080"
      # Comma-separated DIDs: who may call /authorize, and who may set parties.
      ISSUER_DIDS: "${ORG_HOST_ISSUER_DIDS:-}"
      ADMIN_DIDS: "${ORG_HOST_ADMIN_DIDS:-}"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      directory:
        condition: service_started
    command: ["-settings", "/dev/null"]
