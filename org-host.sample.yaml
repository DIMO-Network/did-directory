PORT: 8081
DATABASE_URL: "postgres://dimo:dimo@localhost:5432/dimo_org_host?sslmode=disable"
LOG_LEVEL: "info"
# Base64 of 32 random bytes; seals org signing keys at rest. Required with DATABASE_URL.
#   openssl rand -base64 32
MASTER_KEY: ""
# Where new orgs' #dimo_org keys live: local (sealed under MASTER_KEY) or kms.
# Orgs already registered keep the backend their row names, so switching to kms
# keeps MASTER_KEY needed until no local org remains. kms uses the AWS default
# credential chain (IRSA in the cluster) and needs kms:CreateKey,
# kms:CreateAlias, kms:TagResource, kms:Sign, kms:GetPublicKey,
# kms:DescribeKey, kms:ListResourceTags and kms:ScheduleKeyDeletion.
ORG_SIGNER: "local"
KMS_REGION: ""
KMS_ALIAS_PREFIX: "alias/dimo-org/"
# Identity tokens (RS256, sub = member DID) are verified against this key set.
IDENTITY_JWKS_URL: "http://localhost:8080/signin/keys"
IDENTITY_ISSUER: "http://localhost:8080/signin"
# Tokens must name this host in aud: its public URL, which members request
# from dauth when they sign in to write here.
IDENTITY_AUDIENCE: "http://localhost:8081"
# The DID directory, for control state.
DIRECTORY_URL: "http://localhost:8082"
# How long a vehicle's control state read from the directory is served before
# it is fetched again; empty means 30s. scripts/demo.sh sets 1s.
CONTROL_CACHE_TTL: ""
# DIDs that may call POST /authorize (dauth) and set party attributes (DIMO).
# Comma-separated when given in the environment.
ISSUER_DIDS: []
ADMIN_DIDS: []
PAGE_SIZE: 100
