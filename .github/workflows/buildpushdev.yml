name: buildpushdev
on:
  push:
    branches:
      - main

jobs:
  build:
    name: buildpushdev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: slug
        run: echo "sha7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push did-directory
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: directory
          push: true
          platforms: linux/amd64
          tags: dimozone/did-directory:${{ steps.slug.outputs.sha7 }}, dimozone/did-directory:latest

      - name: Update did-directory image tag
        uses: fjogeleit/yaml-update-action@master
        with:
          valueFile: "charts/did-directory/values.yaml"
          propertyPath: "image.tag"
          value: ${{ steps.slug.outputs.sha7 }}
          branch: main
          message: "Update did-directory image to ${{ steps.slug.outputs.sha7 }}"
