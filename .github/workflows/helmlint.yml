name: Helm Lint
on: pull_request

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint did-directory chart
        run: helm lint charts/did-directory

      - name: Lint did-directory chart with prod values
        run: helm lint charts/did-directory -f charts/did-directory/values-prod.yaml --set image.tag=0000000
