name: buildpushtagged
on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: buildpushtagged-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: buildpushtagged
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tag keeps its v: dimozone/did-directory:v0.2.0, image.tag: v0.2.0.
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push did-directory
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: directory
          push: true
          platforms: linux/amd64
          tags: dimozone/did-directory:${{ steps.tag.outputs.tag }}

  update-values:
    name: update-values
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Update did-directory prod image tag
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          valueFile: "charts/did-directory/values-prod.yaml"
          propertyPath: "image.tag"
          value: ${{ needs.build.outputs.tag }}
          branch: main
          message: "Update did-directory prod image to ${{ needs.build.outputs.tag }}"
