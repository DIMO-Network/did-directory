name: buildpushtagged
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: buildpushtagged-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: buildpushtagged
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tag keeps its v: dimozone/did-directory:v0.2.0, image.tag: v0.2.0.
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push did-directory
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: directory
          push: true
          platforms: linux/amd64
          tags: dimozone/did-directory:${{ steps.tag.outputs.tag }}

  update-values:
    name: update-values
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Its own group, apart from buildpushdev's: a shared one would let a dev bump
    # cancel this queued prod bump (one pending job per group).
    concurrency:
      group: chart-values-prod
      cancel-in-progress: false
    steps:
      # The tag commit is not main; the values file must be main's current one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Update did-directory prod image tag
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          valueFile: "charts/did-directory/values-prod.yaml"
          propertyPath: "image.tag"
          value: ${{ needs.build.outputs.tag }}
          branch: main
          message: "Update did-directory prod image to ${{ needs.build.outputs.tag }}"

      - name: Verify prod tag on main
        id: verify
        continue-on-error: true
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git fetch --quiet origin main
          got=$(git show origin/main:charts/did-directory/values-prod.yaml | yq -r '.image.tag')
          echo "origin/main values-prod.yaml image.tag=${got}, want ${TAG}"
          [ "${got}" = "${TAG}" ]

      - name: Retry prod tag bump
        if: steps.verify.outcome == 'failure'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Update did-directory prod image tag (retry)
        if: steps.verify.outcome == 'failure'
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          valueFile: "charts/did-directory/values-prod.yaml"
          propertyPath: "image.tag"
          value: ${{ needs.build.outputs.tag }}
          branch: main
          message: "Update did-directory prod image to ${{ needs.build.outputs.tag }}"

      - name: Re-verify prod tag on main
        if: steps.verify.outcome == 'failure'
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git fetch --quiet origin main
          got=$(git show origin/main:charts/did-directory/values-prod.yaml | yq -r '.image.tag')
          if [ "${got}" != "${TAG}" ]; then
            echo "::error::Prod bump to ${TAG} did not land on main (values-prod.yaml image.tag is ${got}). Prod is NOT updated; fix and re-run this job."
            exit 1
          fi
