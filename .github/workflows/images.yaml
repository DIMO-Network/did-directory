# Publishes one image per Dockerfile target for every commit on main, tagged
# with the 7-character commit SHA. dimo-node pins these by SHA
# (apps.<name>.sha), so there are no release tags.
name: Images
on:
  push:
    branches:
      - main

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: slug
        run: echo "sha7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # The three targets share the builder stage, which the later steps reuse
      # from this job's buildx cache.
      - name: Build and push did-directory
        uses: docker/build-push-action@v6
        with:
          context: .
          target: directory
          push: true
          platforms: linux/amd64
          tags: dimozone/did-directory:${{ steps.slug.outputs.sha7 }}, dimozone/did-directory:latest

      - name: Build and push org-host
        uses: docker/build-push-action@v6
        with:
          context: .
          target: org-host
          push: true
          platforms: linux/amd64
          tags: dimozone/org-host:${{ steps.slug.outputs.sha7 }}, dimozone/org-host:latest

      - name: Build and push dimocli
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          push: true
          platforms: linux/amd64
          tags: dimozone/dimocli:${{ steps.slug.outputs.sha7 }}, dimozone/dimocli:latest
